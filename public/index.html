<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bailey</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <script src="/scram/scramjet.all.js"></script>
    <script src="/baremux/index.js"></script>
    <script type="module" src="/scripts/app.js"></script>
    <link rel="stylesheet" href="/styles/globals.css" />
    <link rel="stylesheet" href="/styles/index.css" />
    <link rel="stylesheet" href="/styles/light.css" />
    <link rel="icon" type="image/png" href="/icons/favicon.png" />
  </head>
  <body>
    <div id="tabbar">
      <div id="tabs"><button id="new-tab" title="New tab">+</button></div>
    </div>

    <div id="toolbar">
      <button id="nav-back" title="Back">
        <svg class="icon" aria-hidden="true">
          <use href="/icons/back.svg#back" />
        </svg>
      </button>
      <button id="nav-forward" title="Forward">
        <svg class="icon" aria-hidden="true">
          <use href="/icons/forward.svg#forward" />
        </svg>
      </button>
      <button id="nav-reload" title="Reload">
        <svg class="icon" aria-hidden="true">
          <use href="/icons/reload.svg#reload" />
        </svg>
      </button>
      <button id="nav-home" title="Home">
        <svg class="icon" aria-hidden="true">
          <use href="/icons/home.svg#home" />
        </svg>
      </button>

      <form id="address-form">
        <input
          id="address-input"
          type="text"
          placeholder="Search or enter address"
          autocomplete="off"
          spellcheck="false"
        />
      </form>
    </div>
    <div id="loading-bar"><div></div></div>

    <div id="error-message"></div>
    <div id="tab-view"></div>
  </body>
</html>
